<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 460px;
      min-height: 220px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .header img { width: 28px; height: 28px; }
    .header h1 { font-size: 15px; font-weight: 600; color: #fff; }

    #json-view {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 10px;
      color: #aaa;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre;
      word-break: break-word;
      margin-bottom: 10px;
      display: none;
    }

    #json-view.visible { display: block; }

    .status {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .status.idle   { background: #2a2a2a; color: #888; text-align: center; }
    .status.loading {
      background: #1e2a1e; color: #a0d911; border: 1px solid #a0d91133;
      text-align: center;
    }
    .status.success { background: #1e2a1e; border: 1px solid #a0d91144; }
    .status.error   { background: #2a1e1e; border: 1px solid #ff6b6b44; color: #ff6b6b; }

    .verdict { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .verdict.apply   { color: #a0d911; }
    .verdict.skip    { color: #ff6b6b; }
    .verdict.caution { color: #ffd166; }

    .score { font-size: 12px; color: #888; margin-bottom: 8px; }

    .response {
      font-size: 11px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
    }

    /* ── Proposal section ─────────────────────────────────── */
    #proposal-section {
      display: none;
      margin-bottom: 10px;
      border: 1px solid #a0d91144;
      border-radius: 6px;
      overflow: hidden;
    }

    #proposal-section.visible { display: block; }

    .proposal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1a2a0a;
      cursor: pointer;
      user-select: none;
    }

    .proposal-header:hover { background: #223310; }

    .proposal-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #a0d911;
    }

    .proposal-header-left svg { flex-shrink: 0; }

    .proposal-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #888;
    }

    #proposal-copy-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    #proposal-copy-btn:hover { border-color: #a0d911; color: #a0d911; }
    #proposal-copy-btn.copied { border-color: #a0d911; color: #a0d911; }

    .proposal-body {
      padding: 10px 12px;
      font-size: 11px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow-y: auto;
    }

    .bid-recommendation {
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #111;
      border-left: 3px solid #a0d911;
      border-radius: 4px;
      font-size: 11px;
      color: #ccc;
      line-height: 1.5;
    }

    .bid-recommendation .label {
      font-size: 10px;
      font-weight: 700;
      color: #a0d911;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .bid-recommendation .text { color: #ddd; }

    .proposal-move {
      margin-bottom: 10px;
    }

    .proposal-move-title {
      font-size: 10px;
      font-weight: 700;
      color: #a0d911;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .proposal-move-body { color: #ccc; }

    .proposal-note {
      margin-top: 8px;
      padding: 6px 8px;
      background: #2a1e0a;
      border-left: 3px solid #ffd166;
      border-radius: 4px;
      font-size: 10px;
      color: #ffd166;
    }
    /* ── /Proposal section ───────────────────────────────── */

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #a0d91144;
      border-top-color: #a0d911;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .profile-row label {
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }

    #profile-select {
      flex: 1;
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }

    #profile-select:focus { outline: none; border-color: #a0d911; }

    /* ── Proposal checkbox ──────────────────────────────── */
    .proposal-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #1e2a0a;
      border: 1px solid #3a4a1a;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 8px;
    }

    .proposal-toggle:hover { background: #253510; border-color: #5a7a2a; }

    .proposal-toggle.active {
      background: #2a3d0f;
      border-color: #a0d911;
    }

    .proposal-toggle input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #a0d911;
      cursor: pointer;
      flex-shrink: 0;
    }

    .proposal-toggle-label {
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
      flex: 1;
    }

    .proposal-toggle.active .proposal-toggle-label { color: #a0d911; }

    .proposal-toggle-desc {
      font-size: 10px;
      color: #666;
      margin-top: 1px;
    }

    .proposal-toggle.active .proposal-toggle-desc { color: #88aa44; }
    /* ── /Proposal checkbox ─────────────────────────────── */

    .btn-row { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #extract-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
    }
    #extract-btn:hover:not(:disabled) {
      background: #333;
      border-color: #a0d911;
      color: #a0d911;
    }

    #copy-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    #copy-btn:hover:not(:disabled) { background: #333; border-color: #a0d911; color: #a0d911; }
    #copy-btn.copied { background: #1e2a1e; border-color: #a0d911; color: #a0d911; }

    #analyze-btn {
      background: #a0d911;
      color: #000;
    }
    #analyze-btn:hover:not(:disabled) { background: #bfe213; }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #result-path {
      font-size: 10px;
      color: #666;
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="../../icons/icon48.png" alt="icon" id="header-icon">
    <h1>Upwork Job Analyzer</h1>
  </div>

  <div id="json-view"></div>

  <div class="profile-row">
    <label for="profile-select">Profile:</label>
    <select id="profile-select"></select>
  </div>

  <!-- Proposal toggle -->
  <label class="proposal-toggle" id="proposal-toggle">
    <input type="checkbox" id="proposal-checkbox">
    <div>
      <div class="proposal-toggle-label">Write Proposal + Bid Recommendation</div>
      <div class="proposal-toggle-desc">Generates a customized cover letter using your selected profile</div>
    </div>
  </label>

  <div id="status" class="status idle">
    Click "Get Details" to extract, then "Analyze & Save".
  </div>

  <!-- Proposal results (hidden until proposal is generated) -->
  <div id="proposal-section">
    <div class="proposal-header">
      <div class="proposal-header-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Your Proposal
      </div>
      <div class="proposal-header-right">
        <button id="proposal-copy-btn">Copy</button>
        <svg id="proposal-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="proposal-body" id="proposal-body"></div>
  </div>

  <div id="result-path"></div>

  <div class="btn-row">
    <button id="extract-btn" class="btn">Get Details</button>
    <button id="copy-btn" class="btn" disabled>Copy JSON</button>
    <button id="analyze-btn" class="btn" disabled>Analyze &amp; Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
