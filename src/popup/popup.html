<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 460px;
      min-height: 180px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 14px;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-left img { width: 26px; height: 26px; }
    .header-left h1 { font-size: 14px; font-weight: 600; color: #fff; }

    .header-right { display: flex; align-items: center; gap: 6px; }

    .header-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #888;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .header-btn:hover { border-color: #a0d911; color: #a0d911; }

    /* ── Profile panel ─────────────────────────────────────── */
    #profile-panel {
      margin-bottom: 10px;
      padding: 12px;
      background: #222;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      display: none;
    }
    #profile-panel:not(.hidden),
    #profile-panel.visible { display: block; }

    .profile-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .profile-panel small {
      display: block;
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      padding: 8px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #a0d911; }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    #profile-save-btn {
      background: #a0d911;
      border: none;
      color: #000;
      border-radius: 5px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    #profile-save-btn:hover { background: #bfe213; }
    #profile-saved-msg { font-size: 10px; }

    /* ── JSON preview ───────────────────────────────────────── */
    #json-view {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 10px;
      color: #aaa;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre;
      word-break: break-word;
      margin-bottom: 8px;
      display: none;
    }
    #json-view.visible { display: block; }

    /* ── Status ─────────────────────────────────────────────── */
    .status {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }
    .status.idle    { background: #2a2a2a; color: #888; text-align: center; }
    .status.loading { background: #1e2a1e; color: #a0d911; border: 1px solid #a0d91133; text-align: center; }
    .status.success { background: #1e2a1e; border: 1px solid #a0d91144; }
    .status.error   { background: #2a1e1e; border: 1px solid #ff6b6b44; color: #ff6b6b; }

    .verdict { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .verdict.apply   { color: #a0d911; }
    .verdict.skip    { color: #ff6b6b; }
    .verdict.caution { color: #ffd166; }
    .score { font-size: 12px; color: #888; margin-bottom: 6px; }
    .response {
      font-size: 11px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    /* ── Proposal section ─────────────────────────────────────── */
    #proposal-section {
      display: none;
      margin-bottom: 8px;
      border: 1px solid #a0d91144;
      border-radius: 6px;
      overflow: hidden;
    }
    #proposal-section.visible { display: block; }

    .proposal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1a2a0a;
      cursor: pointer;
      user-select: none;
    }
    .proposal-header:hover { background: #223310; }

    .proposal-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #a0d911;
    }

    .proposal-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #888;
    }

    #proposal-copy-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    #proposal-copy-btn:hover { border-color: #a0d911; color: #a0d911; }
    #proposal-copy-btn.copied { border-color: #a0d911; color: #a0d911; }

    .proposal-body {
      padding: 10px 12px;
      font-size: 11px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow-y: auto;
    }

    .bid-recommendation {
      margin-bottom: 8px;
      padding: 8px 10px;
      background: #111;
      border-left: 3px solid #a0d911;
      border-radius: 4px;
    }
    .bid-recommendation .label {
      font-size: 10px;
      font-weight: 700;
      color: #a0d911;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .bid-recommendation .text { color: #ccc; }

    .proposal-move { margin-bottom: 8px; }
    .proposal-move-title {
      font-size: 10px;
      font-weight: 700;
      color: #a0d911;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .proposal-move-body { color: #ccc; }

    .proposal-note {
      margin-top: 6px;
      padding: 6px 8px;
      background: #2a1e0a;
      border-left: 3px solid #ffd166;
      border-radius: 4px;
      font-size: 10px;
      color: #ffd166;
    }
    /* ── /Proposal section ─────────────────────────────────── */

    /* ── Proposal toggle ─────────────────────────────────────── */
    .proposal-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #1e2a0a;
      border: 1px solid #3a4a1a;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 8px;
    }
    .proposal-toggle:hover { background: #253510; border-color: #5a7a2a; }
    .proposal-toggle.active { background: #2a3d0f; border-color: #a0d911; }
    .proposal-toggle input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #a0d911;
      cursor: pointer;
      flex-shrink: 0;
    }
    .proposal-toggle-label { font-size: 12px; font-weight: 600; color: #ccc; flex: 1; }
    .proposal-toggle.active .proposal-toggle-label { color: #a0d911; }
    .proposal-toggle-desc { font-size: 10px; color: #666; margin-top: 1px; }
    .proposal-toggle.active .proposal-toggle-desc { color: #88aa44; }

    /* ── History panel ─────────────────────────────────────── */
    #history-panel {
      display: none;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .history-title-bar {
      font-size: 12px;
      font-weight: 600;
      color: #888;
    }

    .history-actions {
      display: flex;
      gap: 6px;
    }

    .history-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #888;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .history-btn:hover { border-color: #a0d911; color: #a0d911; }
    #history-clear-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    #history-list {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 8px 10px;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .history-item:hover {
      border-color: #a0d911;
      background: #252525;
    }

    .history-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .verdict-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .verdict-badge.apply   { background: #1a2a0a; color: #a0d911; border: 1px solid #a0d91144; }
    .verdict-badge.skip    { background: #2a1e1e; color: #ff6b6b; border: 1px solid #ff6b6b44; }
    .verdict-badge.caution { background: #2a220a; color: #ffd166; border: 1px solid #ffd16644; }

    .history-score {
      font-size: 10px;
      color: #666;
    }

    .history-time {
      font-size: 10px;
      color: #555;
      margin-left: auto;
    }

    .history-item-title {
      font-size: 11px;
      color: #ccc;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-item-skills {
      font-size: 10px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #a0d91144;
      border-top-color: #a0d911;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #extract-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
    }
    #extract-btn:hover:not(:disabled) { background: #333; border-color: #a0d911; color: #a0d911; }
    #copy-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    #copy-btn:hover:not(:disabled) { background: #333; border-color: #a0d911; color: #a0d911; }
    #copy-btn.copied { background: #1e2a1e; border-color: #a0d911; color: #a0d911; }
    #analyze-btn { background: #a0d911; color: #000; }
    #analyze-btn:hover:not(:disabled) { background: #bfe213; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="../../icons/icon48.png" alt="icon">
      <h1>Upwork Job Analyzer</h1>
    </div>
    <div class="header-right">
      <button id="history-toggle-btn" class="header-btn">History</button>
      <button id="profile-toggle-btn" class="header-btn">Edit Profile</button>
    </div>
  </div>

  <!-- Profile panel (collapsed by default) -->
  <div id="profile-panel" class="hidden">
    <div class="profile-panel-title">Your Profile</div>
    <textarea
      id="profile-textarea"
      placeholder="Paste your profile text here for personalized analysis..."
    ></textarea>
    <small>
      Paste your Upwork profile or a summary of your skills, rate, and experience.
      This helps tailor the analysis and proposal to you.
    </small>
    <div class="profile-actions">
      <button id="profile-save-btn">Save Profile</button>
      <span id="profile-saved-msg"></span>
    </div>
  </div>

  <!-- ── Main view ─────────────────────────────────────────── -->
  <div id="main-view">
    <div id="json-view"></div>

    <div id="status" class="status idle">
      Click "Get Details" to extract a job, then "Analyze".
    </div>

    <!-- Proposal toggle -->
    <label class="proposal-toggle" id="proposal-toggle">
      <input type="checkbox" id="proposal-checkbox">
      <div>
        <div class="proposal-toggle-label">Write Proposal + Bid Recommendation</div>
        <div class="proposal-toggle-desc">Generates a customized cover letter</div>
      </div>
    </label>

    <!-- Proposal results -->
    <div id="proposal-section">
      <div class="proposal-header">
        <div class="proposal-header-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Your Proposal
        </div>
        <div class="proposal-header-right">
          <button id="proposal-copy-btn">Copy</button>
          <svg id="proposal-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
      <div class="proposal-body" id="proposal-body"></div>
    </div>

    <div class="btn-row">
      <button id="extract-btn" class="btn">Get Details</button>
      <button id="copy-btn" class="btn" disabled>Copy JSON</button>
      <button id="analyze-btn" class="btn" disabled>Analyze</button>
    </div>
  </div>

  <!-- ── History view ──────────────────────────────────────── -->
  <div id="history-panel">
    <div class="history-header">
      <span class="history-title-bar">Analysis History</span>
      <div class="history-actions">
        <button id="history-clear-btn" class="history-btn">Clear All</button>
        <button id="back-to-main-btn" class="history-btn">← Back</button>
      </div>
    </div>
    <div id="history-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
